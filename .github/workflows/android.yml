name: OnePlus16 Jailbreak Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 作者要求环境：JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 2. 按照作者的说明，进入 app 目录并复制配置
      - name: Setup Configs
        run: |
          cd app
          # 复制示例配置并赋予执行权限
          cp keystore.properties.example keystore.properties || echo "未找到示例配置，跳过"
          chmod +x ../gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 3. 执行编译（因为没提供 release 签名，所以编译 debug 版）
      - name: Build Debug APK
        run: |
          cd app
          ../gradlew assembleDebug --stacktrace

      # 4. 提取生成的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
