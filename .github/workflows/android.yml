name: OnePlus16 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 给足内存，防止编译那 48MB 内置文件时卡死
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 稳妥起见，用 v5 版
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 老老实实装基础 SDK，不加任何花里胡哨的参数
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 作者说要在 app 目录下配置
      - name: Prepare Config
        run: |
          if [ -d "app" ]; then
            cd app
            # 覆盖空签名，规避报错
            echo "" > keystore.properties
            # 告诉 Gradle 安卓 SDK 路径
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          else
            echo "❌ 警告：找不到 app 目录，直接查看根目录结构！"
            ls -la
            exit 1
          fi

      # 编译
      - name: Build Debug
        run: |
          cd app
          chmod +x ../gradlew
          # 用作者说的命令，但如果他写错了我们就跑根目录的
          ../gradlew assembleDebug --stacktrace

      # 提取
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jailbreak-apk
          path: app/build/outputs/apk/debug/*.apk
