name: OnePlus16 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 严格使用作者要求的 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. 安装指定的 Android SDK 37 (如果报错找不到37，就先改成 35 试试)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 37
          build-tools: 37.0.0

      # 3. 配置环境
      - name: Prepare Config
        run: |
          cd app
          # 作者说填自己签名，我们没签名就随便建个空文件糊弄过去，只要不报错就行
          touch keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ../gradlew

      # 4. 绕过签名，直接强制编译 Debug
      - name: Build with Gradle
        run: |
          cd app
          # 加 --no-daemon 防止内存泄漏
          ../gradlew assembleDebug --no-daemon --stacktrace

      # 5. 如果成功，提取 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jailbreak-debug
          path: app/build/outputs/apk/debug/*.apk
