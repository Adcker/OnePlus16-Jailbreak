name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 检查并赋予 gradlew 执行权限，防止因为缺少该文件直接报错
      - name: Check and Grant executable permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "⚠️ 警告: 仓库根目录没有找到 gradlew 文件，可能不是标准的 Gradle 工程结构"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug || echo "⚠️ 编译失败，请检查代码或依赖"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
